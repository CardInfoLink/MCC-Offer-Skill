name: Validate Skill Distribution

on:
  push:
    branches: [main, master, MCC-16172-SKILL]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check repository and platform metadata
        shell: bash
        run: sh tools/release/check.sh
