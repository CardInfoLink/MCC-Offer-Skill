name: Validate Skill Distribution

on:
  push:
    branches: [main, master, MCC-16172-SKILL]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build platform packages
        shell: bash
        run: sh tools/release/package.sh --profile testing --platform all --version 0.1.0-ci
      - name: Validate generic package
        shell: bash
        run: sh tools/release/validate.sh dist/mcc-offer-skill-testing-0.1.0-ci
      - name: Validate npm package manifest
        shell: bash
        working-directory: dist/mcc-offer-skill-npm-testing-0.1.0-ci
        run: npm pack --dry-run --ignore-scripts
