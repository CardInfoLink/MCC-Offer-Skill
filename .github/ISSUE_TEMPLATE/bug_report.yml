name: Bug report
description: Report a reproducible problem with the MCC Offer Skill
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer data, request bodies, or response bodies.
  - type: input
    id: version
    attributes:
      label: Skill version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Agent Skills
        - Claude Code
        - Cursor
        - OpenClaw
        - WorkBuddy
        - npm package
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove URLs with tokens, credentials, request/response bodies, and personal data.
